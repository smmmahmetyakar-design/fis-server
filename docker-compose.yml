services:
  fis:
    build: .
    container_name: fis-otomasyon
    restart: unless-stopped
    ports:
      - "8091:8091"
    volumes:
      - ./data:/data
      # firma klasörleri (mizan/, fislistesi/, banka/ ...) — araç yalnızca okur
      - /srv/veri/firmalar:/firmalar:ro
    environment:
      - FIS_DATA=/data
      - FIS_FIRMALAR=/firmalar
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:14b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 1g
